spring.application.name=reportmanage
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/report?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

report.query.timeout-seconds=45
report.export.task.poll-interval-ms=1500
report.export.task.ttl-hours=24
report.export.task.dir=target/export-report-temp
report.export.wait-message.default=系统正在导出数据,请耐心等待。
report.datasource.crypto-key=report-datasource-key-change-me
report.admin-user-ids=zhangshan

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报表查看</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #f0f4fb;
    --bg2:          #e8eef8;
    --surface:      #ffffff;
    --surface2:     #f5f8ff;
    --border:       #dde4f0;
    --border-md:    #c8d4ea;
    --accent:       #2563eb;
    --accent-light: #eff4ff;
    --accent-mid:   #93b4fa;
    --accent-dark:  #1d4ed8;
    --green:        #16a34a;
    --green-light:  #f0fdf4;
    --text-primary:   #0f172a;
    --text-secondary: #475569;
    --text-muted:     #94a3b8;
    --radius:    10px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,0.08),0 1px 2px rgba(15,23,42,0.04);
    --shadow:    0 4px 16px rgba(15,23,42,0.08),0 1px 4px rgba(15,23,42,0.04);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;}

  /* HEADER */
  .rphd{display:flex;align-items:center;gap:12px;padding:0 28px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);flex-shrink:0;}
  .rpback{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;background:var(--surface2);color:var(--text-secondary);border:1px solid var(--border-md);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .15s;text-decoration:none;}
  .rpback:hover{background:var(--bg2);color:var(--text-primary);}
  .rpback svg{width:13px;height:13px;}
  .rpdiv{width:1px;height:22px;background:var(--border-md);}
  .rptitle{font-size:15px;font-weight:700;color:var(--text-primary);}
  .rpproc{font-family:'JetBrains Mono',monospace;font-size:11px;color:#3b82f6;background:var(--accent-light);border:1px solid #bfdbfe;padding:3px 10px;border-radius:4px;}

  /* BODY */
  .rpbody{flex:1;padding:24px 28px;overflow-y:auto;max-width:1440px;width:100%;margin:0 auto;}

  /* FILTER */
  .rpfilter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .rpfi{display:flex;flex-direction:column;gap:5px;min-width:160px;}
  .rpfil{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;}

  /* QUERY INPUTS - clean white style */
  .qinput{background:#fff;border:1px solid var(--border-md);border-radius:var(--radius-sm);padding:8px 11px;color:var(--text-primary);font-size:13px;font-family:'Noto Sans SC',sans-serif;outline:none;transition:all .18s;min-width:155px;}
  .qinput::placeholder{color:var(--text-muted);}
  .qinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .multi-wrap{display:flex;align-items:center;gap:6px;}
  .multi-wrap .qinput{min-width:180px;flex:1;}
  .btn-multi{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border-md);border-radius:6px;background:#fff;color:var(--text-secondary);cursor:pointer;transition:all .15s;flex-shrink:0;}
  .btn-multi:hover{background:var(--accent-light);border-color:#bfdbfe;color:var(--accent);}
  .btn-multi svg{width:14px;height:14px;}

  /* DATE INPUT - text style + native picker */
  .date-wrap{position:relative;display:inline-flex;align-items:center;width:100%;}
  .qdate-text{padding-right:32px;cursor:pointer;pointer-events:none;}
  .qdate-picker{position:absolute;inset:0;opacity:0;cursor:pointer;border:none;background:transparent;width:100%;height:100%;margin:0;}
  .qdate-picker:focus{outline:none;}
  .date-wrap:focus-within .qdate-text{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .date-wrap .cal-icon{position:absolute;right:9px;pointer-events:none;color:var(--text-muted);display:flex;transition:color .15s;}
  .date-wrap:hover .cal-icon,.date-wrap:focus-within .cal-icon{color:var(--accent);}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans SC',sans-serif;border:1px solid transparent;transition:all .18s;white-space:nowrap;}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28);}
  .btn-accent:hover{background:var(--accent-dark);box-shadow:0 4px 12px rgba(37,99,235,.38);transform:translateY(-1px);}
  .btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-md);}
  .btn-ghost:hover{background:var(--surface2);color:var(--text-primary);}
  .btn:disabled,.btnexp:disabled,.btncols:disabled,.pg:disabled,.ps-select:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:disabled:hover,.btnexp:disabled:hover,.btncols:disabled:hover,.pg:disabled:hover{background:inherit;color:inherit;border-color:inherit;}

  /* TABLE CARD */
  .rptc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}
  .rpth{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .rptools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .btnlog{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;background:#fff;color:var(--accent);border:1px solid #bfdbfe;border-radius:6px;cursor:pointer;transition:all .15s;}
  .btnlog:hover{background:var(--accent-light);border-color:var(--accent-mid);}
  .btnlog svg{width:15px;height:15px;}
  .ps-wrap{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border-md);border-radius:6px;background:#fff;font-size:12px;color:var(--text-muted);}
  .ps-select{height:28px;min-width:88px;border:1px solid var(--border-md);border-radius:6px;background:#fff;color:var(--text-primary);font-size:12px;font-family:'Noto Sans SC',sans-serif;padding:0 6px;outline:none;}
  .ps-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .colpick{position:relative;}
  .btncols{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;background:#fff;color:var(--text-secondary);border:1px solid var(--border-md);border-radius:6px;cursor:pointer;transition:all .15s;}
  .btncols svg{width:15px;height:15px;}
  .btncols:hover{background:var(--accent-light);border-color:#bfdbfe;color:var(--accent);}
  .btncols:disabled{opacity:.45;cursor:not-allowed;}
  .colpanel{position:absolute;right:0;top:calc(100% + 8px);display:none;min-width:240px;max-width:320px;max-height:320px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px;z-index:50;}
  .colpick.open .colpanel{display:block;}
  .col-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;}
  .col-item:hover{background:var(--surface2);}
  .col-item input{accent-color:var(--accent);}
  .col-empty{font-size:12px;color:var(--text-muted);padding:8px;}
  .btnexp{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;background:var(--green-light);color:var(--green);border:1px solid #bbf7d0;border-radius:6px;cursor:pointer;transition:all .15s;}
  .btnexp:hover{background:#dcfce7;}
  .btnexp svg{width:15px;height:15px;}
  .rptw{overflow-x:auto;}
  .rptable{width:100%;border-collapse:collapse;min-width:600px;}
  .rptable thead th{padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-secondary);background:#f8faff;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  .rptable tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
  .rptable tbody tr:last-child{border-bottom:none;}
  .rptable tbody tr:hover{background:#f6f9ff;}
  .rptable tbody td{padding:11px 16px;font-size:13px;color:var(--text-secondary);}

  /* PAGINATION */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .pager-left{display:flex;align-items:center;gap:10px;}
  .pager-info{font-size:12px;color:var(--text-muted);}
  .pager-btns{display:flex;align-items:center;gap:4px;}
  .pg{min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:transparent;border:1px solid var(--border-md);color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;padding:0 6px;transition:all .15s;font-family:'Noto Sans SC',sans-serif;}
  .pg:hover{background:var(--accent-light);border-color:#bfdbfe;color:var(--accent);}
  .pg.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pg:disabled{opacity:.35;cursor:not-allowed;}

  /* NO DATA */
  .nodata{text-align:center;padding:48px 20px;color:var(--text-muted);font-size:13px;}

  /* TOAST */
  .toast{position:fixed;bottom:20px;right:20px;background:#0f172a;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:0 12px 28px rgba(15,23,42,.35);z-index:9999;display:none;align-items:center;gap:8px;border-left:4px solid #22c55e;color:#f8fafc;min-width:220px;max-width:min(420px,calc(100vw - 40px));animation:ti .25s cubic-bezier(.16,1,.3,1);}
  .toast.show{display:flex;}
  .toast.err{background:#7f1d1d;border-left-color:#f87171;color:#fee2e2;}
  @keyframes ti{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;z-index:9998;}
  .modal-mask.open{display:flex;}
  .modal-card{width:min(560px,92vw);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .modal-title{font-size:13px;font-weight:600;color:var(--text-primary);}
  .modal-close{width:28px;height:28px;border:1px solid var(--border-md);border-radius:6px;background:#fff;color:var(--text-secondary);cursor:pointer;}
  .modal-bd{padding:14px;}
  .modal-ta{width:100%;min-height:220px;resize:vertical;border:1px solid var(--border-md);border-radius:6px;padding:10px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;}
  .modal-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface2);}
  .log-list{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .log-item{padding:10px 12px;border-bottom:1px solid var(--border);}
  .log-item:last-child{border-bottom:none;}
  .log-main{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .log-meta{font-size:12px;color:var(--text-secondary);}
  .log-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .log-status.ok{background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .log-status.fail{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
  .log-filters{margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;}
  .log-empty{padding:22px 12px;text-align:center;font-size:12px;color:var(--text-muted);}
</style>
</head>
<body>

<div class="rphd">
  <a class="rpback" id="rpBack" href="report-list.html">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11L5 7l4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回列表
  </a>
  <div class="rpdiv"></div>
  <div class="rptitle" id="rpTitle">报表查看</div>
  <div class="rpproc" id="rpProc"></div>
</div>

<div class="rpbody">
  <div class="rpfilter" id="rpFilter"></div>
  <div class="rptc">
    <div class="rpth">
      <div class="rptools">
        <button class="btnlog" id="rpLogBtn" type="button" title="查询日志" aria-label="查询日志">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 2.5h8a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1v-7a1 1 0 011-1z"/><path d="M4.5 5h5M4.5 7h5M4.5 9h3" stroke-linecap="round"/></svg>
        </button>
        <div class="colpick" id="rpColPick">
          <button class="btncols" id="rpColBtn" type="button" title="显示列" aria-label="显示列">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="3.5" height="10" rx="1"/><rect x="5.5" y="2" width="3.5" height="10" rx="1"/><rect x="9.5" y="2" width="3.5" height="10" rx="1"/></svg>
          </button>
          <div class="colpanel" id="rpColPanel"></div>
        </div>
        <button class="btnexp" id="rpExp" type="button" title="导出 Excel" aria-label="导出 Excel">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2v7M4.5 6.5L7 9l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11h10" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="rptw">
      <table class="rptable">
        <thead id="rpTh"></thead>
        <tbody id="rpTb"></tbody>
      </table>
    </div>
    <div class="pager" id="rpPager">
      <div class="pager-left">
        <label class="ps-wrap" for="rpPageSize">
          每页
          <select class="ps-select" id="rpPageSize"></select>
          行
        </label>
        <span class="pager-info" id="rpPageInfo">共 0 条</span>
      </div>
      <div class="pager-btns" id="rpPagerBtns"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="batchModal">
  <div class="modal-card">
    <div class="modal-hd">
      <span class="modal-title" id="batchTitle">批量填写</span>
      <button class="modal-close" type="button" onclick="closeBatchModal()">✕</button>
    </div>
    <div class="modal-bd">
      <textarea class="modal-ta" id="batchInput" placeholder="可从Excel粘贴多行，一行一个值"></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" type="button" onclick="closeBatchModal()">取消</button>
      <button class="btn btn-accent" type="button" onclick="confirmBatchInput()">确定</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="logModal">
  <div class="modal-card">
    <div class="modal-hd">
      <span class="modal-title">查询日志</span>
      <button class="modal-close" type="button" onclick="closeLogModal()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="log-list" id="logList"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" id="logPrevBtn" type="button">上一页</button>
      <span class="pager-info" id="logPageInfo">第 1 页</span>
      <button class="btn btn-ghost" id="logNextBtn" type="button">下一页</button>
    </div>
  </div>
</div>

<script>
const contextMatch=window.location.pathname.match(/^(.*?)(?:\/report-view(?:\.html)?(?:\/[^/?#]+)?)$/);
const CONTEXT_PATH=contextMatch?contextMatch[1]:'';
const API_BASE=`${CONTEXT_PATH}/api/reports`;
const LIST_PAGE_URL=`${CONTEXT_PATH}/report-list`;
const params=new URLSearchParams(window.location.search);
const pathMatch=window.location.pathname.match(/\/report-view\/([^/?#]+)/);
const viewId=params.get('id')||(pathMatch?decodeURIComponent(pathMatch[1]):'');
const PAGE_SIZE_OPTIONS=[10,20,50,100,200];
const DEFAULT_PAGE_SIZE=20;
const DAY_MS=24*60*60*1000;
const QUERY_TIMEOUT_MS=45000;

let report=null;
let currentData={total:0,pageNo:1,pageSize:20,columns:[],rows:[]};
let queryPageSize=DEFAULT_PAGE_SIZE;
let visibleColumnFields=[];
let queryBusy=false;
let exportBusy=false;
let exportPollTimer=null;
let batchTargetField='';
let toastTimer=null;
let logPageNo=1;
let logPageSize=10;
let logTotal=0;

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jsQuote(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n');}
function pad2(n){return n<10?`0${n}`:`${n}`;}
function isDateType(type){return type==='date'||type==='datetime';}
function isDateRangeSearchField(field){return !!field&&field.match==='range'&&isDateType(field.type);}
function isSelectControl(field){return !!field&&('single_select'===field.controlType||'multi_select'===field.controlType);}

function getSearchFields(){
  if(report&&Array.isArray(report.searchFields)&&report.searchFields.length){
    return report.searchFields.slice().sort((a,b)=>(a.searchSort||0)-(b.searchSort||0));
  }
  if(report&&Array.isArray(report.fields)){
    return report.fields.filter(f=>!!f.searchable).map((f,idx)=>({
      label:f.label,
      field:f.field,
      type:f.type,
      match:f.match,
      controlType:f.match==='in'?'multi_select':'input',
      multilineEnabled:false,
      searchSort:f.searchSort||idx+1,
      defaultQueryDays:f.defaultQueryDays||0,
      maxQueryDays:f.maxQueryDays||0,
      options:[]
    })).sort((a,b)=>(a.searchSort||0)-(b.searchSort||0));
  }
  return [];
}

async function requestJson(url,options={}){
  const rsp=await fetch(url,options);
  const json=await rsp.json().catch(()=>({success:false,message:'服务返回非JSON'}));
  if(!rsp.ok||!json.success) throw new Error(json.message||`请求失败(${rsp.status})`);
  return json.data;
}

async function requestJsonWithTimeout(url,options={},timeoutMs=QUERY_TIMEOUT_MS){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const rsp=await fetch(url,{...options,signal:controller.signal});
    const json=await rsp.json().catch(()=>({success:false,message:'服务返回非JSON'}));
    if(!rsp.ok||!json.success) throw new Error(json.message||`请求失败(${rsp.status})`);
    return json.data;
  }catch(err){
    if(err&&err.name==='AbortError') throw new Error('查询耗时过长，请缩小范围后重试');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

function normalizeMultiText(raw){
  const values=String(raw||'').split(/[\r\n;]+/).map(s=>s.trim()).filter(Boolean);
  const dedup=[];
  const set=new Set();
  values.forEach(v=>{if(!set.has(v)){set.add(v);dedup.push(v);}});
  return dedup.join(';');
}

function getFilterPayload(){
  const searchFields=getSearchFields();
  const filters={};
  searchFields.forEach(f=>{
    if(f.match==='range'){
      const sv=document.getElementById(`q_${f.field}_start`)?.value?.trim()||'';
      const ev=document.getElementById(`q_${f.field}_end`)?.value?.trim()||'';
      if(sv) filters[`${f.field}_start`]=sv;
      if(ev) filters[`${f.field}_end`]=ev;
      return;
    }
    let value='';
    if(f.controlType==='multi_select'){
      const el=document.getElementById(`q_${f.field}`);
      if(el) value=Array.from(el.selectedOptions||[]).map(o=>o.value.trim()).filter(Boolean).join(';');
    }else{
      value=document.getElementById(`q_${f.field}`)?.value?.trim()||'';
      if(f.multilineEnabled) value=normalizeMultiText(value);
    }
    if(value) filters[f.field]=value;
  });
  return filters;
}

function renderNotFound(msg){
  document.getElementById('rpTitle').textContent='未找到报表';
  document.getElementById('rpProc').textContent='';
  document.getElementById('rpFilter').innerHTML='<span style="font-size:13px;color:var(--text-muted);">请从列表页重新进入</span>';
  document.getElementById('rpTh').innerHTML='';
  document.getElementById('rpTb').innerHTML=`<tr><td colspan="99" class="nodata">${esc(msg||'报表不存在')}</td></tr>`;
  document.getElementById('rpPageInfo').textContent='共 0 条';
  document.getElementById('rpPagerBtns').innerHTML='';
  const pageSizeEl=document.getElementById('rpPageSize'); if(pageSizeEl) pageSizeEl.innerHTML='';
  const colBtn=document.getElementById('rpColBtn'); if(colBtn) colBtn.disabled=true;
  const colPanel=document.getElementById('rpColPanel'); if(colPanel) colPanel.innerHTML='<div class="col-empty">暂无可选列</div>';
  document.getElementById('rpExp').disabled=true;
  document.getElementById('rpLogBtn').disabled=true;
  closeColumnPanel();
  setQueryBusy(false);
  setExportBusy(false);
}

function syncDateText(el){
  if(!el) return;
  const displayId=el.getAttribute('data-display');
  if(!displayId) return;
  const display=document.getElementById(displayId);
  if(!display) return;
  display.value=el.value?el.value.replace('T',' '):'';
}

function openDatePicker(el){
  if(!el) return;
  el.focus();
  if(typeof el.showPicker==='function'){
    try{el.showPicker();}catch(_){}
  }
}

function formatDateValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function formatDateTimeLocalValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}

function applyDefaultDateRangeFilters(){
  getSearchFields().filter(isDateRangeSearchField).forEach(f=>{
    const defaultDays=Number(f.defaultQueryDays||0);
    if(!Number.isFinite(defaultDays)||defaultDays<=0) return;
    const startEl=document.getElementById(`q_${f.field}_start`);
    const endEl=document.getElementById(`q_${f.field}_end`);
    if(!startEl||!endEl) return;
    if((startEl.value||'').trim()||(endEl.value||'').trim()) return;
    if(f.type==='date'){
      const endDate=new Date(); endDate.setHours(0,0,0,0);
      const startDate=new Date(endDate.getTime()-Math.max(0,defaultDays-1)*DAY_MS);
      startEl.value=formatDateValue(startDate);
      endEl.value=formatDateValue(endDate);
    }else{
      const endDateTime=new Date(); endDateTime.setSeconds(0,0);
      const startDateTime=new Date(endDateTime.getTime()-defaultDays*DAY_MS);
      startEl.value=formatDateTimeLocalValue(startDateTime);
      endEl.value=formatDateTimeLocalValue(endDateTime);
    }
    syncDateText(startEl);
    syncDateText(endEl);
  });
}

function calcRangeDays(fieldType,startValue,endValue){
  if(!startValue||!endValue) return 0;
  if(fieldType==='date'){
    const start=new Date(`${startValue}T00:00:00`);
    const end=new Date(`${endValue}T00:00:00`);
    if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime())) return -2;
    if(end<start) return -1;
    return Math.floor((end-start)/DAY_MS)+1;
  }
  const start=new Date(startValue);
  const end=new Date(endValue);
  if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime())) return -2;
  if(end<start) return -1;
  return Math.max(1,Math.ceil((end-start)/DAY_MS));
}

function validateDateRangeFilters(){
  for(const f of getSearchFields().filter(isDateRangeSearchField)){
    const start=(document.getElementById(`q_${f.field}_start`)?.value||'').trim();
    const end=(document.getElementById(`q_${f.field}_end`)?.value||'').trim();
    if(!start||!end) continue;
    const days=calcRangeDays(f.type,start,end);
    if(days===-2) return `${f.label} 日期格式不正确`;
    if(days<0) return `${f.label} 开始时间不能大于结束时间`;
    const maxDays=Number(f.maxQueryDays||0);
    if(Number.isFinite(maxDays)&&maxDays>0&&days>maxDays) return `${f.label} 查询范围最多 ${maxDays} 天`;
  }
  return '';
}

function normalizePageSize(raw,fallback){
  const n=Number(raw);
  if(!Number.isFinite(n)||n<1) return fallback;
  return Math.floor(n);
}

function setupPageSizeControl(size){
  const select=document.getElementById('rpPageSize');
  if(!select) return;
  const safeSize=normalizePageSize(size,DEFAULT_PAGE_SIZE);
  const options=PAGE_SIZE_OPTIONS.slice();
  if(!options.includes(safeSize)){options.push(safeSize);options.sort((a,b)=>a-b);}
  select.innerHTML=options.map(v=>`<option value="${v}">${v}</option>`).join('');
  select.value=String(safeSize);
  queryPageSize=safeSize;
}

function setQueryBusy(busy){
  queryBusy=busy;
  const queryBtn=document.getElementById('btnQuery');
  const resetBtn=document.getElementById('btnReset');
  const pageSizeEl=document.getElementById('rpPageSize');
  if(queryBtn){
    queryBtn.disabled=busy;
    queryBtn.innerHTML=busy?'查询中...':'<svg viewBox="0 0 13 13" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="4"/><path d="M9 9l2.5 2.5" stroke-linecap="round"/></svg>查询';
  }
  if(resetBtn) resetBtn.disabled=busy;
  if(pageSizeEl) pageSizeEl.disabled=busy;
  document.querySelectorAll('.pg').forEach(btn=>{btn.disabled=busy;});
}

function setExportBusy(busy){
  exportBusy=busy;
  const expBtn=document.getElementById('rpExp');
  if(expBtn) expBtn.disabled=busy;
}

function bindToolbarEvents(){
  const pageSizeEl=document.getElementById('rpPageSize');
  if(pageSizeEl){
    pageSizeEl.addEventListener('change',()=>{
      if(queryBusy) return;
      queryPageSize=normalizePageSize(pageSizeEl.value,queryPageSize);
      doQuery(1);
    });
  }
  const colBtn=document.getElementById('rpColBtn');
  if(colBtn){
    colBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(queryBusy) return;
      toggleColumnPanel();
    });
  }
  const panel=document.getElementById('rpColPanel');
  if(panel) panel.addEventListener('click',(e)=>e.stopPropagation());

  const logBtn=document.getElementById('rpLogBtn');
  if(logBtn){
    logBtn.addEventListener('click',()=>{
      if(!report) return;
      openLogModal();
    });
  }
  const logPrevBtn=document.getElementById('logPrevBtn');
  if(logPrevBtn){
    logPrevBtn.addEventListener('click',()=>{
      if(logPageNo<=1) return;
      loadLogs(logPageNo-1);
    });
  }
  const logNextBtn=document.getElementById('logNextBtn');
  if(logNextBtn){
    logNextBtn.addEventListener('click',()=>{
      const totalPages=Math.max(1,Math.ceil(logTotal/logPageSize));
      if(logPageNo>=totalPages) return;
      loadLogs(logPageNo+1);
    });
  }
}

function closeColumnPanel(){document.getElementById('rpColPick')?.classList.remove('open');}
function toggleColumnPanel(){const wrap=document.getElementById('rpColPick'); if(wrap) wrap.classList.toggle('open');}

function getSortedColumns(){return (currentData.columns||[]).slice().sort((a,b)=>(a.sort??0)-(b.sort??0));}

function ensureVisibleColumns(cols){
  const allFields=cols.map(c=>String(c.field??''));
  if(!allFields.length){visibleColumnFields=[];return;}
  if(!Array.isArray(visibleColumnFields)||!visibleColumnFields.length){visibleColumnFields=allFields.slice();return;}
  const allSet=new Set(allFields);
  visibleColumnFields=visibleColumnFields.filter(f=>allSet.has(f));
  if(!visibleColumnFields.length) visibleColumnFields=allFields.slice();
}

function getVisibleColumns(cols){
  ensureVisibleColumns(cols);
  const visibleSet=new Set(visibleColumnFields);
  return cols.filter(c=>visibleSet.has(String(c.field??'')));
}

function onColumnToggleChange(e){
  const field=e.target.getAttribute('data-field')||'';
  if(!field) return;
  const next=new Set(visibleColumnFields);
  if(e.target.checked) next.add(field); else next.delete(field);
  if(next.size===0){
    e.target.checked=true;
    showToast('至少保留一列显示',true);
    return;
  }
  visibleColumnFields=Array.from(next);
  renderTable();
}

function renderColumnPicker(cols){
  const panel=document.getElementById('rpColPanel');
  const btn=document.getElementById('rpColBtn');
  if(!panel||!btn) return;
  if(!cols.length){
    btn.disabled=true;
    panel.innerHTML='<div class="col-empty">暂无可选列</div>';
    closeColumnPanel();
    return;
  }
  btn.disabled=false;
  ensureVisibleColumns(cols);
  const visibleSet=new Set(visibleColumnFields);
  panel.innerHTML=cols.map(c=>{
    const field=String(c.field??'');
    const checked=visibleSet.has(field)?'checked':'';
    return `<label class="col-item"><input type="checkbox" class="col-toggle" data-field="${escAttr(field)}" ${checked}><span>${esc(c.label)}</span></label>`;
  }).join('');
  panel.querySelectorAll('.col-toggle').forEach(input=>input.addEventListener('change',onColumnToggleChange));
}

function buildOptionHtml(options){
  const arr=Array.isArray(options)?options:[];
  return arr.map(o=>`<option value="${escAttr(o.value)}">${esc(o.label)}</option>`).join('');
}

            ${isDate?`

                <input type="${inputType}" class="qdate-picker" id="q_${f.field}_start" data-display="q_${f.field}_start_text" onchange="syncDateText(this)" oninput="syncDateText(this)" onclick="openDatePicker(this)">
                <span class="cal-icon">${calSvg}</span>
              </div>`:`
              <input type="text" class="qinput" id="q_${f.field}_start" placeholder="开始" style="width:120px;">`}
            <span style="color:var(--text-muted);font-size:12px;">至</span>
            ${isDate?`
              <div class="date-wrap" style="width:${f.type==='datetime'?'195px':'165px'};">
                <input type="text" class="qinput qdate-text" id="q_${f.field}_end_text" placeholder="结束" readonly>
                <input type="${inputType}" class="qdate-picker" id="q_${f.field}_end" data-display="q_${f.field}_end_text" onchange="syncDateText(this)" oninput="syncDateText(this)" onclick="openDatePicker(this)">
                <span class="cal-icon">${calSvg}</span>
              </div>`:`
              <input type="text" class="qinput" id="q_${f.field}_end" placeholder="结束" style="width:120px;">`}
          </div>`:isDate?`
          <div class="date-wrap" style="width:${f.type==='datetime'?'195px':'165px'};">
            <input type="text" class="qinput qdate-text" id="q_${f.field}_text" placeholder="请选择${esc(f.label)}" readonly>
            <input type="${inputType}" class="qdate-picker" id="q_${f.field}" data-display="q_${f.field}_text" onchange="syncDateText(this)" oninput="syncDateText(this)" onclick="openDatePicker(this)">
            <span class="cal-icon">${calSvg}</span>
          </div>`:isSelectControl(f)?`
          <select class="qinput" id="q_${f.field}" ${f.controlType==='multi_select'?'multiple size="3" style="min-width:170px;max-width:220px;"':''}>
            ${f.controlType==='single_select'?'<option value="">请选择</option>':''}
            ${selectOptions}
          </select>`:f.multilineEnabled?`
          <div class="multi-wrap">
            <input type="text" class="qinput" id="q_${f.field}" placeholder="请输入${esc(f.label)}">
            <button class="btn-multi" type="button" title="批量填写" aria-label="批量填写" onclick="openBatchModal('${jsQuote(f.field)}','${jsQuote(f.label)}')">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h10M2 7h10M2 10.5h6" stroke-linecap="round"/><path d="M10 10.5h2M11 9.5v2" stroke-linecap="round"/></svg>

        查询
      </button>
      <button class="btn btn-ghost" id="btnReset" onclick="resetQuery()">重置</button>

function openBatchModal(field,label){
  batchTargetField=field;
  const el=document.getElementById(`q_${field}`);
  const normalized=normalizeMultiText(el?.value||'');
  document.getElementById('batchTitle').textContent=`批量填写 - ${label||field}`;
  document.getElementById('batchInput').value=normalized?normalized.split(';').join('\n'):'';
  document.getElementById('batchModal').classList.add('open');
}

function closeBatchModal(){
  document.getElementById('batchModal').classList.remove('open');
  batchTargetField='';
}

function confirmBatchInput(){
  if(!batchTargetField) return;
  const value=normalizeMultiText(document.getElementById('batchInput').value||'');
  const el=document.getElementById(`q_${batchTargetField}`);
  if(el) el.value=value;
  closeBatchModal();
}

async function doQuery(pageNo){
  if(!report||queryBusy) return;
  const validationMsg=validateDateRangeFilters();
  if(validationMsg){showToast(validationMsg,true);return;}
  setQueryBusy(true);
  try{
    const payload={pageNo:pageNo||1,pageSize:queryPageSize,filters:getFilterPayload()};
    const data=await requestJsonWithTimeout(`${API_BASE}/${report.id}/query`,{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=UTF-8'},
      body:JSON.stringify(payload)
    },QUERY_TIMEOUT_MS);
    currentData=data;
    queryPageSize=normalizePageSize(data.pageSize,queryPageSize);
    setupPageSizeControl(queryPageSize);
    renderTable();
  }catch(err){
    showToast(err.message,true);
  }finally{
    setQueryBusy(false);
  }
  renderPager();
}

function resetQuery(){
  document.querySelectorAll('#rpFilter input').forEach(el=>{el.value='';});
  document.querySelectorAll('#rpFilter select').forEach(el=>{
    if(el.multiple) Array.from(el.options).forEach(o=>o.selected=false);
    else el.value='';
  });
  applyDefaultDateRangeFilters();
  doQuery(1);
}

function renderTable(){
  if(!report) return;
  const cols=getSortedColumns();
  renderColumnPicker(cols);
  const visibleCols=getVisibleColumns(cols);
  document.getElementById('rpTh').innerHTML=`<tr>${visibleCols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr>`;
  const rows=Array.isArray(currentData.rows)?currentData.rows:[];
  const tb=document.getElementById('rpTb');
  if(!rows.length){
    tb.innerHTML=`<tr><td colspan="${visibleCols.length||1}" class="nodata">暂无匹配数据</td></tr>`;
  }else{
    tb.innerHTML=rows.map(row=>`<tr>${visibleCols.map(c=>`<td>${esc(String(row[c.field]??''))}</td>`).join('')}</tr>`).join('');
  }
}

function renderPager(){
  const total=Number(currentData.total||0);
  const pageSize=Number(currentData.pageSize||20);
  const pageNo=Number(currentData.pageNo||1);
  const totalPages=Math.max(1,Math.ceil(total/pageSize));
  const infoEl=document.getElementById('rpPageInfo');
  const btnWrap=document.getElementById('rpPagerBtns');
  if(!infoEl||!btnWrap) return;
  if(total===0){
    infoEl.textContent='共 0 条';
    btnWrap.innerHTML='';
    return;
  }
  const start=(pageNo-1)*pageSize+1;
  const end=Math.min(pageNo*pageSize,total);
  infoEl.textContent=`第 ${start}-${end} 条，共 ${total} 条`;
  if(totalPages<=1){
    btnWrap.innerHTML='';
    return;
  }
  let h=`<button class="pg" onclick="goPage(1)" ${pageNo===1?'disabled':''}>首</button>`;
  h+=`<button class="pg" onclick="goPage(${pageNo-1})" ${pageNo===1?'disabled':''}>‹</button>`;
  let s=Math.max(1,pageNo-3);
  let e=Math.min(totalPages,s+6);
  if(e-s<6)s=Math.max(1,e-6);
  for(let i=s;i<=e;i++){h+=`<button class="pg ${i===pageNo?'on':''}" onclick="goPage(${i})">${i}</button>`;}
  h+=`<button class="pg" onclick="goPage(${pageNo+1})" ${pageNo===totalPages?'disabled':''}>›</button>`;
  h+=`<button class="pg" onclick="goPage(${totalPages})" ${pageNo===totalPages?'disabled':''}>末</button>`;
  btnWrap.innerHTML=h;
}

function goPage(p){
  if(queryBusy) return;
  const totalPages=Math.max(1,Math.ceil(Number(currentData.total||0)/Number(currentData.pageSize||20)));
  if(p<1||p>totalPages) return;
  doQuery(p);
  document.querySelector('.rptc').scrollIntoView({behavior:'smooth',block:'start'});
}

function showToast(msg,isErr=false,durationMs=2600){
  const t=document.getElementById('toast');
  if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}
  t.textContent=msg;
  if(isErr) t.classList.add('err');
  else t.classList.remove('err');
  t.classList.add('show');
  const duration=Number(durationMs||0);
  if(duration>0){
    toastTimer=setTimeout(()=>{
      t.classList.remove('show');
      t.classList.remove('err');
    },duration);
  }
}

function formatLogTime(raw){
  if(!raw) return '';
  const text=String(raw).replace('T',' ');
  return text.length>=19?text.slice(0,19):text;
}

function renderLogs(page){
  const list=Array.isArray(page?.list)?page.list:[];
  const wrap=document.getElementById('logList');
  if(!wrap) return;
  if(!list.length){
    wrap.innerHTML='<div class="log-empty">暂无日志记录</div>';
  }else{
    wrap.innerHTML=list.map(item=>{
      const ok=String(item.status||'').toUpperCase()==='SUCCESS';
      const statusCls=ok?'ok':'fail';
      const statusText=ok?'SUCCESS':'FAILED';
      const filters=item.filtersJson?esc(item.filtersJson):'{}';
      const reportName=esc(item.reportName||`报表ID:${item.reportId||''}`);
      const err=(!ok&&item.errorMessage)?`<div class="log-meta" style="color:#b91c1c;margin-top:4px;">${esc(item.errorMessage)}</div>`:'';
      return `<div class="log-item">
        <div class="log-main">
          <div>
            <div class="log-meta"><strong>${reportName}</strong></div>
            <div class="log-meta">${esc(item.actionType||'QUERY')} | 页码 ${Number(item.pageNo||1)} / 每页 ${Number(item.pageSize||0)} / 总数 ${Number(item.resultTotal||0)}</div>
            <div class="log-meta">${esc(formatLogTime(item.createdAt))}</div>
            ${err}
          </div>
          <span class="log-status ${statusCls}">${statusText}</span>
        </div>
        <div class="log-filters">${filters}</div>
      </div>`;
    }).join('');
  }
  const totalPages=Math.max(1,Math.ceil(logTotal/logPageSize));
  document.getElementById('logPageInfo').textContent=`第 ${logPageNo} / ${totalPages} 页`;
  document.getElementById('logPrevBtn').disabled=logPageNo<=1;
  document.getElementById('logNextBtn').disabled=logPageNo>=totalPages;
}

async function loadLogs(pageNo){
  if(!report) return;
  const safePageNo=Math.max(Number(pageNo||1),1);
  const data=await requestJson(`${API_BASE}/logs?pageNo=${safePageNo}&pageSize=${logPageSize}&reportId=${encodeURIComponent(report.id)}`);
  logPageNo=Number(data.pageNo||safePageNo);
  logPageSize=Number(data.pageSize||logPageSize||10);
  logTotal=Number(data.total||0);
  renderLogs(data);
}

async function openLogModal(){
  document.getElementById('logModal').classList.add('open');
  try{
    await loadLogs(1);
  }catch(err){
    showToast(err.message,true);
  }
}

function closeLogModal(){
  document.getElementById('logModal').classList.remove('open');
}

function triggerDownload(url){
  const a=document.createElement('a');
  a.href=url;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function startExportPolling(taskId,pollIntervalMs){
  if(exportPollTimer){clearTimeout(exportPollTimer);exportPollTimer=null;}
  const interval=Math.max(Number(pollIntervalMs||1500),500);
  const tick=async()=>{
    try{
      const status=await requestJson(`${API_BASE}/${report.id}/exports/${taskId}`);
      if(status.status==='SUCCESS'){
        setExportBusy(false);
        showToast(status.message||'导出已完成');
        triggerDownload(`${API_BASE}/${report.id}/exports/${taskId}/download`);
        return;
      }
      if(status.status==='FAILED'||status.status==='EXPIRED'){
        setExportBusy(false);
        showToast(status.message||'导出失败',true);
        return;
      }
      exportPollTimer=setTimeout(tick,interval);
    }catch(err){
      setExportBusy(false);
      showToast(err.message,true);
    }
  };
  exportPollTimer=setTimeout(tick,interval);
}

async function exportExcel(){
  if(!report||exportBusy) return;
  const validationMsg=validateDateRangeFilters();
  if(validationMsg){showToast(validationMsg,true);return;}
  setExportBusy(true);
  try{
    const payload={pageNo:1,pageSize:queryPageSize,filters:getFilterPayload()};
    const task=await requestJson(`${API_BASE}/${report.id}/exports`,{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=UTF-8'},
      body:JSON.stringify(payload)
    });
    showToast(task.message||'导出任务已提交',false,0);
    startExportPolling(task.taskId,task.pollIntervalMs);
  }catch(err){
    setExportBusy(false);
    showToast(err.message,true);
  }
}

async function init(){
  document.getElementById('rpBack').setAttribute('href',LIST_PAGE_URL);
  bindToolbarEvents();
  setupPageSizeControl(DEFAULT_PAGE_SIZE);
  document.getElementById('rpColBtn').disabled=true;
  document.getElementById('rpLogBtn').disabled=true;
  document.getElementById('rpColPanel').innerHTML='<div class="col-empty">暂无可选列</div>';
  document.getElementById('batchModal').addEventListener('click',(e)=>{if(e.target.id==='batchModal') closeBatchModal();});
  document.getElementById('logModal').addEventListener('click',(e)=>{if(e.target.id==='logModal') closeLogModal();});
  if(!viewId){renderNotFound('缺少报表ID参数');return;}
  try{
    report=await requestJson(`${API_BASE}/${encodeURIComponent(viewId)}`);
    document.getElementById('rpTitle').textContent=report.name||'报表查看';
    document.getElementById('rpProc').textContent=report.procedureName||'';
    document.title=(report.name||'报表查看')+' - 报表查看';
    setupPageSizeControl(report.pageSize||DEFAULT_PAGE_SIZE);
    renderFilter();
    document.getElementById('rpExp').onclick=exportExcel;
    document.getElementById('rpLogBtn').disabled=false;
    await doQuery(1);
  }catch(err){
    renderNotFound(err.message||'未找到指定报表');
  }
}

init();
</script>
</body>
</html>
